name: Build and test

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/snabble

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure access to private snabble repos
        run: git config --global url.https://${{ inputs.gh-token }}@github.com/snabble.insteadOf https://github.com/snabble
        shell: bash

      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        shell: bash
        run: go vet ./...

      - name: Run Staticcheck
        shell: bash
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest && \
          staticcheck ./...

      - name: Test the source
        shell: bash
        run: go test ./...
